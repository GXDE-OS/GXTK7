# CPPLINT configuration file for GXTK7
# Strict Google C++ Style Guide enforcement

# 100 characters line length standard for Google style modern C++
linelength=100

# Include order & headers
headers=h,hpp

# Configure filters aligned with Google C++ style
# Qt-friendly adjustments for Q_OBJECT, signals/slots, moc-generated files if any
filter=-build/c++11
filter=-runtime/references
filter=-build/include_subdir
filter=-build/include_order
